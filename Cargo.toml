[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
description = "Repackage Debian .deb files as pacman packages and keep them updated"
publish = false

[dependencies]
flate2 = "1.1.10"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
toml = "1.1.6"
ureq = "3.4.2"
xz2 = "0.1.7"
zstd = "0.14.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
