[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
description = "Repackage Debian .deb files as pacman packages and keep them updated"
publish = false

[dependencies]
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
xz2 = "0.1.7"
zstd = "0.14.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
