# Ready made sources for known apps, used by 'pacdeb add <name>' when no --source is
# given. Compiled into the binary.

[proton-mail]
note = "Proton publishes Stable, EarlyAccess and Alpha builds. Pick one with --channel, or set a global channel with 'pacdeb set --channel'."

[proton-mail.source]
type = "direct"
feed = "https://proton.me/download/mail/linux/version.json"
version_json = "Releases[CategoryName={channel}].Version"
url_json = "Releases[CategoryName={channel}].File[Identifier=.deb (Ubuntu/Debian)].Url"
checksum_json = "Releases[CategoryName={channel}].File[Identifier=.deb (Ubuntu/Debian)].Sha512CheckSum"
default_channel = "Stable"

[example-app]
note = "The apt repository is signed; pacdeb fetched its key and checked it against the vendor's published fingerprint."

[example-app.apt]
url = "https://apt.example.com/app/stable"
suite = "stable"
components = ["main"]
key_url = "https://apt.example.com/app/key.asc"
key_fingerprint = "A1B2C3D4E5F60718293A4B5C6D7E8F9001122334"

[example-app.source]
type = "apt"
repository = "example-app"
package = "example-app"

# Apps tested converting with pacdeb (2026-10). Key fingerprints are pinned only where
# the vendor publishes one; the others are shown for comparing when first added.

[google-chrome]
note = "Google's apt repository; the key is checked against the fingerprint Google publishes."

[google-chrome.apt]
url = "https://dl.google.com/linux/chrome/deb"
suite = "stable"
components = ["main"]
key_url = "https://dl.google.com/linux/linux_signing_key.pub"
key_fingerprint = "EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796"

[google-chrome.source]
type = "apt"
repository = "google-chrome"
package = "google-chrome-stable"

[microsoft-edge]
note = "Microsoft's apt repository; the key is checked against the fingerprint Microsoft publishes."

[microsoft-edge.apt]
url = "https://packages.microsoft.com/repos/edge"
suite = "stable"
components = ["main"]
key_url = "https://packages.microsoft.com/keys/microsoft.asc"
key_fingerprint = "BC528686B50D79E339D3721CEB3E94ADBE1229CF"

[microsoft-edge.source]
type = "apt"
repository = "microsoft-edge"
package = "microsoft-edge-stable"

[brave]
note = "Brave's apt repository. Brave publishes no key fingerprint; compare the one shown with the key Brave serves."

[brave.apt]
url = "https://brave-browser-apt-release.s3.brave.com"
suite = "stable"
components = ["main"]
key_url = "https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg"

[brave.source]
type = "apt"
repository = "brave"
package = "brave-browser"

[signal]
note = "Signal's apt repository (its suite is called xenial for every release)."

[signal.apt]
url = "https://updates.signal.org/desktop/apt"
suite = "xenial"
components = ["main"]
key_url = "https://updates.signal.org/desktop/apt/keys.asc"

[signal.source]
type = "apt"
repository = "signal"
package = "signal-desktop"

[element]
note = "Element's apt repository."

[element.apt]
url = "https://packages.element.io/debian"
suite = "default"
components = ["main"]
key_url = "https://packages.element.io/debian/element-io-archive-keyring.gpg"

[element.source]
type = "apt"
repository = "element"
package = "element-desktop"

[spotify]
note = "Spotify's apt repository. Spotify names its key file after the key and replaces it every year or two; if updates stop verifying, set the new link with 'pacdeb apt key spotify --key-url <url>'."

[spotify.apt]
url = "https://repository.spotify.com"
suite = "stable"
components = ["non-free"]
key_url = "https://download.spotify.com/debian/pubkey_5384CE82BA52C83A.asc"

[spotify.source]
type = "apt"
repository = "spotify"
package = "spotify-client"

[1password]
note = "1Password's apt repository; the key is checked against the fingerprint 1Password publishes."

[1password.apt]
url = "https://downloads.1password.com/linux/debian/amd64"
suite = "stable"
components = ["main"]
key_url = "https://downloads.1password.com/linux/keys/1password.asc"
key_fingerprint = "3FEF9748469ADBE15DA7CA80AC2D62742012EA22"

[1password.source]
type = "apt"
repository = "1password"
package = "1password"

[mullvad-vpn]
note = "Mullvad's apt repository. The app needs its background service: after installing, pacdeb shows the command that starts it."

[mullvad-vpn.apt]
url = "https://repository.mullvad.net/deb/stable"
suite = "stable"
components = ["main"]
key_url = "https://repository.mullvad.net/deb/mullvad-keyring.asc"

[mullvad-vpn.source]
type = "apt"
repository = "mullvad"
package = "mullvad-vpn"

[discord]
note = "Discord's own download link. Its deb is a small launcher that downloads and updates the app itself."

[discord.source]
type = "direct"
url = "https://discord.com/api/download?platform=linux&format=deb"

[zoom]
note = "Zoom's own download link, which always serves the latest version."

[zoom.source]
type = "direct"
url = "https://zoom.us/client/latest/zoom_amd64.deb"

[obsidian]
note = "Obsidian's releases on GitHub."

[obsidian.source]
type = "github"
repo = "obsidianmd/obsidian-releases"
asset = "obsidian_*_amd64.deb"

[bitwarden]
note = "Bitwarden's desktop releases on GitHub."

[bitwarden.source]
type = "github"
repo = "bitwarden/clients"
asset = "Bitwarden-*-amd64.deb"

[rustdesk]
note = "RustDesk's releases on GitHub. It runs a background service: after installing, pacdeb shows the command that starts it."

[rustdesk.source]
type = "github"
repo = "rustdesk/rustdesk"
asset = "rustdesk-*-x86_64.deb"
