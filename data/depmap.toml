# Built in Debian to Arch dependency names, compiled into the binary.
# Users can override entries in ~/.config/ferry/depmap.toml.
#
# Format: "debian-name" = "arch-name"
# Use an empty string for a dependency Arch does not need; that drops the whole
# alternative group it appears in.
# The "t64" names are Debian's 64 bit time_t renames of the same libraries.

[map]
# C runtime
"libc6" = "glibc"
"libgcc-s1" = "libgcc"
"libgcc1" = "libgcc"
"libstdc++6" = "libstdc++"
"zlib1g" = "zlib"
"libffi8" = "libffi"
"libpcre2-8-0" = "pcre2"
"libuuid1" = "util-linux-libs"
"libudev1" = "systemd-libs"
"libsystemd0" = "systemd-libs"
"libsqlite3-0" = "sqlite"
"libxml2" = "libxml2"
"libpng16-16" = "libpng"
"libpng16-16t64" = "libpng"
"libjpeg-turbo8" = "libjpeg-turbo"
"libjpeg62-turbo" = "libjpeg-turbo"
"libgcrypt20" = "libgcrypt"
"libsasl2-2" = "libsasl"
"libpci3" = "pciutils"
"libvips42" = "libvips"
"libvips42t64" = "libvips"

# Crypto and networking
"libnss3" = "nss"
"libnss3-tools" = "nss"
"libnspr4" = "nspr"
"libssl3" = "openssl"
"libssl3t64" = "openssl"
"libcurl4" = "curl"
"libcurl4t64" = "curl"
"libcurl3-gnutls" = "libcurl-gnutls"
"libcurl3t64-gnutls" = "libcurl-gnutls"
"libkrb5-3" = "krb5"
"libgssapi-krb5-2" = "krb5"
"ca-certificates" = "ca-certificates"
"gnupg" = "gnupg"
"curl" = "curl"
"wget" = "wget"

# GTK and desktop
"libgtk-3-0" = "gtk3"
"libgtk-3-0t64" = "gtk3"
"libgtk-4-1" = "gtk4"
"libglib2.0-0" = "glib2"
"libglib2.0-0t64" = "glib2"
"libglib2.0-bin" = "glib2"
"libpango-1.0-0" = "pango"
"libpangocairo-1.0-0" = "pango"
"libcairo2" = "cairo"
"libgdk-pixbuf-2.0-0" = "gdk-pixbuf2"
"libgdk-pixbuf2.0-0" = "gdk-pixbuf2"
"libatk1.0-0" = "at-spi2-core"
"libatk1.0-0t64" = "at-spi2-core"
"libatk-bridge2.0-0" = "at-spi2-core"
"libatk-bridge2.0-0t64" = "at-spi2-core"
"libatspi2.0-0" = "at-spi2-core"
"libatspi2.0-0t64" = "at-spi2-core"
"libnotify4" = "libnotify"
"libnotify-bin" = "libnotify"
"libsecret-1-0" = "libsecret"
"libsecret-tools" = "libsecret"
"gnome-keyring" = "gnome-keyring"
"libayatana-appindicator3-1" = "libayatana-appindicator"
"libdbus-1-3" = "dbus"
"libcups2" = "libcups"
"libcups2t64" = "libcups"
"libfontconfig1" = "fontconfig"
"libfreetype6" = "freetype2"
"libexpat1" = "expat"
"xdg-utils" = "xdg-utils"
"xdg-desktop-portal" = "xdg-desktop-portal"
"xdg-desktop-portal-gtk" = "xdg-desktop-portal-gtk"
"xdg-desktop-portal-gnome" = "xdg-desktop-portal-gnome"
"xdg-desktop-portal-kde" = "xdg-desktop-portal-kde"
"plasma-workspace" = "plasma-workspace"
"gvfs" = "gvfs"
"desktop-file-utils" = "desktop-file-utils"
"hicolor-icon-theme" = "hicolor-icon-theme"
"shared-mime-info" = "shared-mime-info"
"kde-cli-tools" = "kde-cli-tools"
"trash-cli" = "trash-cli"
"gvfs-bin" = "gvfs"

# X11, Wayland and graphics
"libx11-6" = "libx11"
"libx11-xcb1" = "libx11"
"libxcb1" = "libxcb"
"libxcb-dri3-0" = "libxcb"
"libxcomposite1" = "libxcomposite"
"libxcursor1" = "libxcursor"
"libxdamage1" = "libxdamage"
"libxext6" = "libxext"
"libxfixes3" = "libxfixes"
"libxi6" = "libxi"
"libxkbcommon0" = "libxkbcommon"
"libxkbfile1" = "libxkbfile"
"libxrandr2" = "libxrandr"
"libxrender1" = "libxrender"
"libxshmfence1" = "libxshmfence"
"libxss1" = "libxss"
"libxtst6" = "libxtst"
"libwayland-client0" = "wayland"
"libdrm2" = "libdrm"
"libgbm1" = "mesa"
"libgl1" = "libglvnd"
"libegl1" = "libglvnd"
"libgl1-mesa-glx" = "libglvnd"
"libvulkan1" = "vulkan-icd-loader"

# Audio. pulseaudio maps to the client library so it works with pipewire-pulse.
"libasound2" = "alsa-lib"
"libasound2t64" = "alsa-lib"
"libpulse0" = "libpulse"
"pulseaudio" = "libpulse"
"libpipewire-0.3-0" = "libpipewire"
"libpipewire-0.3-0t64" = "libpipewire"

# Virtualization (apps that run their own virtual machine)
"qemu-system-x86" = "qemu-system-x86"
"ovmf" = "edk2-ovmf"
"virtiofsd" = "virtiofsd"

# Base tools
"bash" = "bash"
"coreutils" = "coreutils"
"procps" = "procps-ng"
"python3" = "python"
"unzip" = "unzip"
"lsb-release" = "lsb-release"
"bubblewrap" = "bubblewrap"
"socat" = "socat"
